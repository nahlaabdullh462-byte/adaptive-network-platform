<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="vpnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="tunnelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#vpnBg)" />
  <rect width="896" height="476" x="2" y="2" rx="15" fill="none" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 40)">
    <text x="0" y="20" font-family="'Cairo', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">
      أنفاق الشبكات الافتراضية الخاصة: Site-to-Site IPsec VPN Tunnel &amp; ESP Encapsulation
    </text>
    <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">
      SECURE WAN ENCAPSULATION (IKE PHASE 1 &amp; 2, ESP ENCRYPTION WITH AES-256 &amp; SHA-256 HASH)
    </text>
  </g>

  <!-- Left: Branch Office LAN -->
  <g transform="translate(40, 110)">
    <rect width="200" height="200" rx="12" fill="rgba(59, 130, 246, 0.08)" stroke="#3B82F6" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="28" rx="10" fill="#1E3A8A" />
    <text x="100" y="19" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">فرع الشركة (Branch Office)</text>
    
    <text x="20" y="55" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Private Subnet:</text>
    <text x="20" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#60A5FA">192.168.10.0/24</text>

    <!-- Branch Gateway Router -->
    <rect x="20" y="105" width="160" height="70" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
    <text x="100" y="132" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#FFF" text-anchor="middle">ROUTER R1</text>
    <text x="100" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="middle">Branch VPN Gateway</text>
    <text x="100" y="165" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8" text-anchor="middle">Public IP: 203.0.113.1</text>
  </g>

  <!-- Center: Public Internet Cloud + Encrypted Tunnel -->
  <g transform="translate(260, 110)">
    <!-- Cloud Background Box -->
    <rect width="380" height="200" rx="12" fill="rgba(244, 63, 94, 0.04)" stroke="#475569" stroke-dasharray="4,4" />
    <text x="190" y="30" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">شبكة الإنترنت العامة غير الموثوقة (Public WAN)</text>

    <!-- Glowing IPsec Tunnel Pipe -->
    <rect x="15" y="75" width="350" height="60" rx="12" fill="url(#tunnelGrad)" fill-opacity="0.25" stroke="#A855F7" stroke-width="2" />
    <text x="190" y="102" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#E9D5FF" text-anchor="middle">IPSEC ENCRYPTED TUNNEL</text>
    <text x="190" y="122" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">ESP (Protocol 50) + AES-256 + HMAC-SHA256</text>

    <!-- Lock Icon in Tunnel -->
    <circle cx="190" cy="50" r="14" fill="#8B5CF6" />
    <text x="190" y="55" font-family="'Font Awesome 6 Free', sans-serif" font-size="12" fill="#FFF" text-anchor="middle">🔒</text>
    <text x="190" y="165" font-family="'Cairo', sans-serif" font-size="11" fill="#C084FC" text-anchor="middle">حماية مطلقة من التنصت والتلاعب</text>
  </g>

  <!-- Right: Headquarters LAN -->
  <g transform="translate(660, 110)">
    <rect width="200" height="200" rx="12" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="28" rx="10" fill="#065F46" />
    <text x="100" y="19" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">المقر الرئيسي (Headquarters)</text>
    
    <text x="20" y="55" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Private Subnet:</text>
    <text x="20" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#34D399">10.0.0.0/16</text>

    <!-- HQ Gateway Router -->
    <rect x="20" y="105" width="160" height="70" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <text x="100" y="132" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#FFF" text-anchor="middle">ROUTER R2</text>
    <text x="100" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="middle">HQ VPN Gateway</text>
    <text x="100" y="165" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981" text-anchor="middle">Public IP: 198.51.100.1</text>
  </g>

  <!-- Packet Anatomy on Tunnel (Bottom Section) -->
  <g transform="translate(40, 330)">
    <rect width="820" height="115" rx="10" fill="#1E293B" stroke="#334155" />
    <text x="20" y="24" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#A5B4FC">
      تفكيك حزمة الـ IPsec Tunnel Mode:
    </text>

    <!-- Packets Blocks -->
    <g transform="translate(20, 38)">
      <!-- New Outer IP Header -->
      <rect x="0" y="0" width="140" height="42" rx="4" fill="#3B82F6" />
      <text x="70" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">NEW IP HEADER</text>
      <text x="70" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#BFDBFE" text-anchor="middle">203.0.113.1 -&gt; 198.51.100.1</text>

      <!-- ESP Header -->
      <rect x="145" y="0" width="100" height="42" rx="4" fill="#8B5CF6" />
      <text x="195" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">ESP HEADER</text>
      <text x="195" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E9D5FF" text-anchor="middle">SPI &amp; Seq Num</text>

      <!-- Original Encrypted IP Header -->
      <rect x="250" y="0" width="180" height="42" rx="4" fill="#10B981" />
      <text x="340" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">ORIGINAL IP (ENCRYPTED)</text>
      <text x="340" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D1FAE5" text-anchor="middle">192.168.10.10 -&gt; 10.0.1.5</text>

      <!-- Original TCP/UDP Payload -->
      <rect x="435" y="0" width="190" height="42" rx="4" fill="#059669" />
      <text x="530" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">TCP/DATA (ENCRYPTED)</text>
      <text x="530" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A7F3D0" text-anchor="middle">Confidential Enterprise Payload</text>

      <!-- ESP Trailer & Auth -->
      <rect x="630" y="0" width="150" height="42" rx="4" fill="#8B5CF6" />
      <text x="705" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">ESP TRAILER &amp; AUTH</text>
      <text x="705" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E9D5FF" text-anchor="middle">Padding &amp; HMAC Integrity</text>
    </g>

    <text x="20" y="102" font-family="'Cairo', sans-serif" font-size="11" fill="#94A3B8">
      * في نمط النفق (Tunnel Mode)، يتم تشفير الحزمة الأصلية بالكامل بما في ذلك ترويسة الـ IP الداخلية لحماية خصوصية العناوين الخاصة.
    </text>
  </g>
</svg>
