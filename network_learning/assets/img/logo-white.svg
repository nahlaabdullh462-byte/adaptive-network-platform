<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="wEmblemBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12132A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="wBrandIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="wBrandCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="wBrandPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="wProBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B4FE8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <radialGradient id="wEmblemCoreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <filter id="wSvgGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="wCardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ================= EMBLEM ICON (Left) ================= -->
  <g transform="translate(10, 10)">
    <rect width="76" height="76" rx="20" fill="url(#wEmblemBgGrad)" filter="url(#wCardShadow)" />
    <rect width="74" height="74" x="1" y="1" rx="19" fill="none" stroke="url(#wBrandIndigo)" stroke-width="1.2" stroke-opacity="0.7" />

    <circle cx="38" cy="38" r="22" fill="url(#wEmblemCoreLight)" opacity="0.45" />

    <g filter="url(#wSvgGlow)">
      <polygon points="38,14 59,26 59,50 38,62 17,50 17,26" fill="none" stroke="url(#wBrandCyan)" stroke-width="1.6" stroke-linejoin="round" />
      <polygon points="38,25 49,32 49,44 38,51 27,44 27,32" fill="rgba(99, 102, 241, 0.15)" stroke="url(#wBrandPurple)" stroke-width="1.3" stroke-linejoin="round" />

      <line x1="38" y1="14" x2="38" y2="25" stroke="url(#wBrandCyan)" stroke-width="1.4" />
      <line x1="59" y1="26" x2="49" y2="32" stroke="url(#wBrandCyan)" stroke-width="1.4" />
      <line x1="59" y1="50" x2="49" y2="44" stroke="url(#wBrandCyan)" stroke-width="1.4" />
      <line x1="38" y1="62" x2="38" y2="51" stroke="url(#wBrandCyan)" stroke-width="1.4" />
      <line x1="17" y1="50" x2="27" y2="44" stroke="url(#wBrandCyan)" stroke-width="1.4" />
      <line x1="17" y1="26" x2="27" y2="32" stroke="url(#wBrandCyan)" stroke-width="1.4" />

      <line x1="38" y1="38" x2="38" y2="25" stroke="#38BDF8" stroke-width="1" stroke-dasharray="1.5,1.5" />
      <line x1="38" y1="38" x2="49" y2="32" stroke="#38BDF8" stroke-width="1" stroke-dasharray="1.5,1.5" />
      <line x1="38" y1="38" x2="49" y2="44" stroke="#38BDF8" stroke-width="1" stroke-dasharray="1.5,1.5" />
      <line x1="38" y1="38" x2="38" y2="51" stroke="#38BDF8" stroke-width="1" stroke-dasharray="1.5,1.5" />
      <line x1="38" y1="38" x2="27" y2="44" stroke="#38BDF8" stroke-width="1" stroke-dasharray="1.5,1.5" />
      <line x1="38" y1="38" x2="27" y2="32" stroke="#38BDF8" stroke-width="1" stroke-dasharray="1.5,1.5" />

      <line x1="38" y1="14" x2="38" y2="7" stroke="#38BDF8" stroke-width="1.4" />
      <circle cx="38" cy="7" r="2.2" fill="#E0F2FE" />

      <line x1="59" y1="26" x2="65" y2="22" stroke="#818CF8" stroke-width="1.4" />
      <circle cx="65" cy="22" r="2" fill="#C084FC" />

      <line x1="59" y1="50" x2="65" y2="54" stroke="#38BDF8" stroke-width="1.4" />
      <circle cx="65" cy="54" r="2" fill="#38BDF8" />

      <line x1="38" y1="62" x2="38" y2="69" stroke="#818CF8" stroke-width="1.4" />
      <circle cx="38" cy="69" r="2.2" fill="#818CF8" />

      <line x1="17" y1="50" x2="11" y2="54" stroke="#38BDF8" stroke-width="1.4" />
      <circle cx="11" cy="54" r="2" fill="#38BDF8" />

      <line x1="17" y1="26" x2="11" y2="22" stroke="#818CF8" stroke-width="1.4" />
      <circle cx="11" cy="22" r="2" fill="#C084FC" />

      <circle cx="38" cy="14" r="2.8" fill="#38BDF8" />
      <circle cx="59" cy="26" r="2.8" fill="#818CF8" />
      <circle cx="59" cy="50" r="2.8" fill="#38BDF8" />
      <circle cx="38" cy="62" r="2.8" fill="#818CF8" />
      <circle cx="17" cy="50" r="2.8" fill="#38BDF8" />
      <circle cx="17" cy="26" r="2.8" fill="#818CF8" />

      <circle cx="38" cy="38" r="4.2" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="38" cy="38" r="1.8" fill="#38BDF8" />
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING (White for Dark Mode) ================= -->
  <text x="104" y="52" font-family="'Plus Jakarta Sans', 'Cairo', -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.03em" fill="#FFFFFF">
    Net<tspan fill="#818CF8">Learn</tspan>
  </text>

  <!-- PRO Glowing Badge -->
  <g transform="translate(262, 27)">
    <rect width="54" height="26" rx="8" fill="url(#wProBadgeGrad)" />
    <rect width="52" height="24" x="1" y="1" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" />
    <text x="27" y="17" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">PRO</text>
  </g>

  <!-- Subtitle Tagline with Live Active Indicator -->
  <g transform="translate(106, 73)">
    <circle cx="4" cy="-4" r="3.5" fill="#10B981" />
    <circle cx="4" cy="-4" r="6" fill="#10B981" opacity="0.4" />
    
    <text x="15" y="0" font-family="'JetBrains Mono', 'IBM Plex Sans Arabic', monospace" font-weight="700" font-size="10.5" fill="#38BDF8" letter-spacing="0.12em">
      ADAPTIVE NETWORK PLATFORM
    </text>
  </g>
</svg>
