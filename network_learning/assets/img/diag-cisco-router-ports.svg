<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ciscoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#ciscoBg)" />
  <rect width="896" height="476" x="2" y="2" rx="15" fill="none" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 40)">
    <text x="0" y="20" font-family="'Cairo', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">
      هيكلية منافذ راوتر ومبدلات سيسكو: Cisco ISR Router &amp; Switch Physical Interfaces
    </text>
    <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">
      HARDWARE PORTS ANATOMY (CONSOLE RJ-45, AUX, GIGABIT ETHERNET, SFP FIBER, USB)
    </text>
  </g>

  <!-- Cisco 1RU Chassis Front/Rear Panel -->
  <g transform="translate(40, 105)">
    <!-- Chassis Body -->
    <rect width="820" height="150" rx="8" fill="url(#chassisGrad)" stroke="#475569" stroke-width="2" />
    <!-- Ventilation Grills -->
    <line x1="20" y1="20" x2="20" y2="130" stroke="#0F172A" stroke-width="3" />
    <line x1="26" y1="20" x2="26" y2="130" stroke="#0F172A" stroke-width="3" />
    <line x1="32" y1="20" x2="32" y2="130" stroke="#0F172A" stroke-width="3" />

    <!-- Cisco Logo Badge on Chassis -->
    <text x="70" y="45" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="900" fill="#38BDF8">CISCO</text>
    <text x="70" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">ISR 4331 SERIES</text>
    <circle cx="75" cy="85" r="4" fill="#10B981" />
    <text x="86" y="89" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">PWR OK</text>
    <circle cx="75" cy="105" r="4" fill="#10B981" />
    <text x="86" y="109" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">STAT OK</text>

    <!-- 1. Console Port (Light Blue RJ-45) -->
    <g transform="translate(180, 40)">
      <rect width="60" height="50" rx="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
      <rect x="18" y="15" width="24" height="25" fill="#0F172A" />
      <text x="30" y="70" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#38BDF8" text-anchor="middle">CONSOLE</text>
      <text x="30" y="84" font-family="'Cairo', sans-serif" font-size="8.5" fill="#94A3B8" text-anchor="middle">منفذ التحكم</text>
    </g>

    <!-- 2. AUX Port (Black RJ-45) -->
    <g transform="translate(260, 40)">
      <rect width="60" height="50" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
      <rect x="18" y="15" width="24" height="25" fill="#0F172A" />
      <text x="30" y="70" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#94A3B8" text-anchor="middle">AUX</text>
      <text x="30" y="84" font-family="'Cairo', sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle">المودم الإضافي</text>
    </g>

    <!-- 3. GE 0/0/0 (Copper RJ-45 WAN/LAN) -->
    <g transform="translate(360, 40)">
      <rect width="65" height="50" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
      <rect x="20" y="15" width="25" height="25" fill="#0F172A" />
      <circle cx="25" cy="8" r="2.5" fill="#10B981" />
      <circle cx="40" cy="8" r="2.5" fill="#F59E0B" />
      <text x="32" y="70" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#FBBF24" text-anchor="middle">GE 0/0/0</text>
      <text x="32" y="84" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8" text-anchor="middle">10/100/1000</text>
    </g>

    <!-- 4. GE 0/0/1 (Copper RJ-45) -->
    <g transform="translate(440, 40)">
      <rect width="65" height="50" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
      <rect x="20" y="15" width="25" height="25" fill="#0F172A" />
      <circle cx="25" cy="8" r="2.5" fill="#10B981" />
      <circle cx="40" cy="8" r="2.5" fill="#F59E0B" />
      <text x="32" y="70" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#FBBF24" text-anchor="middle">GE 0/0/1</text>
      <text x="32" y="84" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8" text-anchor="middle">10/100/1000</text>
    </g>

    <!-- 5. SFP Fiber Optical Port (SFP Cage) -->
    <g transform="translate(530, 36)">
      <rect width="70" height="56" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.8" />
      <rect x="15" y="14" width="40" height="28" fill="#064E3B" stroke="#34D399" />
      <text x="35" y="75" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#34D399" text-anchor="middle">SFP FIBER</text>
      <text x="35" y="89" font-family="'Cairo', sans-serif" font-size="8.5" fill="#94A3B8" text-anchor="middle">ألياف ضوئية</text>
    </g>

    <!-- 6. NIM WAN Expansion Slot (Serial / T1 / 4G) -->
    <g transform="translate(630, 25)">
      <rect width="170" height="100" rx="6" fill="#0F172A" stroke="#64748B" stroke-dasharray="2,2" />
      <text x="85" y="35" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#A5B4FC" text-anchor="middle">NIM EXPANSION SLOT</text>
      <text x="85" y="55" font-family="'Cairo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">فتحة توسعة بطاقات WAN</text>
      <rect x="25" y="65" width="120" height="26" rx="4" fill="#1E293B" stroke="#475569" />
      <text x="85" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8" text-anchor="middle">Serial / T1 / E1 / LTE</text>
    </g>
  </g>

  <!-- Detailed Descriptions & Cable Guide (Bottom Cards) -->
  <g transform="translate(40, 280)">
    <!-- Card 1: Console Cable -->
    <g transform="translate(0, 0)">
      <rect width="255" height="150" rx="10" fill="#1E293B" stroke="#334155" />
      <rect x="1" y="1" width="253" height="30" rx="9" fill="rgba(2, 132, 199, 0.15)" />
      <text x="12" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#38BDF8">1. CONSOLE CABLE (RJ-45)</text>
      <text x="12" y="55" font-family="'Cairo', sans-serif" font-size="11.5" fill="#E2E8F0">• التوصيل المباشر (Out-of-Band).</text>
      <text x="12" y="77" font-family="'Cairo', sans-serif" font-size="11.5" fill="#E2E8F0">• كابل أزرق سماوي (Rollover Cable).</text>
      <text x="12" y="99" font-family="'Cairo', sans-serif" font-size="11.5" fill="#E2E8F0">• برامج الاتصال: PuTTY أو SecureCRT.</text>
      <text x="12" y="121" font-family="'Cairo', sans-serif" font-size="11" fill="#94A3B8">الإعدادات: 9600 Baud, 8 Data, No Parity</text>
    </g>

    <!-- Card 2: Copper Ethernet Cable -->
    <g transform="translate(280, 0)">
      <rect width="255" height="150" rx="10" fill="#1E293B" stroke="#334155" />
      <rect x="1" y="1" width="253" height="30" rx="9" fill="rgba(245, 158, 11, 0.15)" />
      <text x="12" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#F59E0B">2. ETHERNET PORTS (RJ-45)</text>
      <text x="12" y="55" font-family="'Cairo', sans-serif" font-size="11.5" fill="#E2E8F0">• كابل Cat6 أو Cat6a (UTP/STP).</text>
      <text x="12" y="77" font-family="'Cairo', sans-serif" font-size="11.5" fill="#E2E8F0">• Straight-Through (بين أجهزة مختلفة).</text>
      <text x="12" y="99" font-family="'Cairo', sans-serif" font-size="11.5" fill="#E2E8F0">• Crossover (بين راوتر وراوتر مباشرة).</text>
      <text x="12" y="121" font-family="'Cairo', sans-serif" font-size="11" fill="#94A3B8">خاصية Auto-MDIX تكتشف النوع تلقائياً</text>
    </g>

    <!-- Card 3: Fiber Optic SFP -->
    <g transform="translate(565, 0)">
      <rect width="255" height="150" rx="10" fill="#1E293B" stroke="#334155" />
      <rect x="1" y="1" width="253" height="30" rx="9" fill="rgba(16, 185, 129, 0.15)" />
      <text x="12" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#10B981">3. SFP FIBER OPTICS</text>
      <text x="12" y="55" font-family="'Cairo', sans-serif" font-size="11.5" fill="#E2E8F0">• ألياف بصرية لمسافات شاسعة (WAN).</text>
      <text x="12" y="77" font-family="'Cairo', sans-serif" font-size="11.5" fill="#E2E8F0">• Single-Mode (أصفر - للمسافات البعيدة).</text>
      <text x="12" y="99" font-family="'Cairo', sans-serif" font-size="11.5" fill="#E2E8F0">• Multi-Mode (برتقالي/سماوي - داخل المبنى).</text>
      <text x="12" y="121" font-family="'Cairo', sans-serif" font-size="11" fill="#94A3B8">موصلات LC Duplex (TX إرسال / RX استقبال)</text>
    </g>
  </g>
</svg>
